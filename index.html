<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VastMyWealth - Loan & Channel Portal</title>
    <link rel="manifest" href="/Bank-Channel/manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/Bank-Channel/1000550390.png">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 16px;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .logo-img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid var(--border-color);
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            margin: 0;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .portal-btn {
            background-color: #ffffff;
            color: var(--primary);
            border: 2px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .portal-btn span {
            display: flex;
            align-items: center;
            gap: zpx;
        }

        .portal-btn.primary {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .portal-btn.primary:hover {
            background-color: var(--accent-hover);
        }

        .portal-btn:not(.primary):hover {
            border-color: var(--accent);
            background-color: #f1f5f9;
            color: var(--accent);
        }

        .arrow-icon {
            font-size: 15px;
            font-weight: bold;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        
        <!-- Compact Header directly showing website elements without giant logo -->
        <div class="header-row">
            <img src="/Bank-Channel/1000550390.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div>
                <h1 class="brand-title">VastMyWealth</h1>
                <div class="brand-subtitle">Institutional Loan & Channel Portal</div>
            </div>
        </div>

        <div class="btn-stack">
            <!-- Button 1: Apply for Loan -->
            <a href="https://loan.vastmywealth.com/portal-unified-application.html?ref=P592020" class="portal-btn primary">
                <span>🏦 Apply for Loan</span>
                <span class="arrow-icon">→</span>
            </a>

            <!-- Button 2: Register / Login as Partner -->
            <a href="https://loan.vastmywealth.com/partner-login.html" class="portal-btn">
                <span>👥 Partner Portal</span>
                <span class="arrow-icon">→</span>
            </a>

            <!-- Button 3: Banker Login -->
            <a href="https://vastmywealth-byte.github.io/VastMyWealth/" class="portal-btn">
                <span>🔐 Banker Login</span>
                <span class="arrow-icon">→</span>
            </a>
        </div>

        <div class="footer-note">
            Secure 256-bit Encrypted Portal
        </div>

    </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/Bank-Channel/sw.js')
        .then(reg => console.log('ServiceWorker scope:', reg.scope))
        .catch(err => console.log('ServiceWorker error:', err));
    });
  }
</script>

</body>
</html>
