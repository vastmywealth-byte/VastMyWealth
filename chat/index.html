<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>VastMyWealth Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0B1A38;
    --accent: #193666;
    --bg: #F4F6F9;
    --chat-bg: #FFFFFF;
    --user-msg: #E3E9F3;
    --bot-msg: #0B1A38;
  }
  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Inter', sans-serif;
    background-color: var(--bg);
    overflow: hidden;
  }
  .chat-container {
    display: flex; flex-direction: column;
    width: 100%; max-width: 600px; margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    height: var(--app-h, 100dvh);
    background: var(--chat-bg);
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
  }
  @media (max-width: 480px) {
    .header { padding: 12px 14px; }
    .chat-box { padding: 14px; }
    .msg { max-width: 90%; font-size: 13.5px; }
  }
  .header {
    background: var(--primary); color: white;
    padding: 16px 20px; display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .header img { width: 32px; height: 32px; border-radius: 4px; }
  .header h2 { margin: 0; font-family: 'Poppins', sans-serif; font-size: 16px; }
  .header p { margin: 0; font-size: 12px; opacity: 0.8; }
  .chat-box {
    flex: 1; min-height: 0; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .msg.bot { background: var(--bot-msg); color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--user-msg); color: var(--primary); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg a { color: #9FD3FF; }
  .divider {
    align-self: center; font-size: 11px; color: #9099A8; text-transform: uppercase;
    letter-spacing: .04em; margin: 4px 0; text-align: center;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 95%; }
  .chip {
    border: 1px solid var(--primary); color: var(--primary); background: white;
    border-radius: 16px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .chip:active { background: var(--user-msg); }
  .chip.opt { padding: 10px 16px; font-size: 13.5px; font-weight: 500; border-radius: 20px; }

  .cta-card {
    align-self: flex-start; max-width: 85%; background: #F4F6F9; border: 1px solid #E3E9F3;
    border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .cta-card .cta-title { font-size: 13px; font-weight: 600; color: var(--primary); }
  .cta-card .cta-sub { font-size: 12px; color: #5B6472; line-height: 1.4; }
  .cta-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--primary); color: white; text-decoration: none;
    border-radius: 20px; padding: 10px 16px; font-size: 13.5px; font-weight: 600;
    font-family: 'Inter', sans-serif; cursor: pointer;
  }
  .cta-btn:active { background: var(--accent); }

  .input-area {
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: white; border-top: 1px solid #eee;
    display: flex; gap: 10px; align-items: center;
    flex-shrink: 0;
  }
  .file-upload {
    cursor: pointer; padding: 10px; color: var(--primary);
    background: #f0f0f0; border-radius: 50%; display: flex; justify-content: center; align-items: center;
  }
  .file-upload input { display: none; }
  .file-upload svg { width: 20px; height: 20px; }
  input[type="text"] {
    flex: 1; min-width: 0; padding: 12px 16px; border: 1px solid #ddd;
    border-radius: 24px; font-family: 'Inter', sans-serif;
    font-size: 16px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--primary); }
  .send-btn {
    background: var(--primary); color: white; border: none;
    padding: 12px 18px; border-radius: 24px; font-weight: 600;
    cursor: pointer; font-family: 'Inter', sans-serif; flex-shrink: 0;
  }
  .typing { font-size: 12px; color: #888; padding: 0 20px; margin-top: -8px; display: none; flex-shrink: 0; }
  .disclosure { font-size: 10.5px; color: #9099A8; text-align: center; padding: 4px 16px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <img src="../1000550390.png" alt="VastMyWealth" onerror="this.style.display='none'">
    <div>
      <h2 id="headerName">VastMyWealth Assistant</h2>
      <p>Secure 24x7 Loan Support · Marketplace — lenders decide final approval</p>
    </div>
  </div>
  <div class="chat-box" id="chatBox"></div>
  <div class="typing" id="typingIndicator">Typing...</div>
  <div class="disclosure">VastMyWealth is a loan marketplace, not a lender. Final approval, amount and rate are decided by the lending partner.</div>
  <div class="input-area">
    <label class="file-upload" id="fileUploadLabel">
      <input type="file" id="fileInput" onchange="onFilePicked()">
      <svg fill="currentColor" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-3.04-2.46-5.5-5.5-5.5S4 1.96 4 5v11.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
    </label>
    <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
    <button class="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>
<script>
  // ---------- Mobile fit: always match the visible screen (keyboard-aware) ----------
  function scrollDown() { const b = document.getElementById("chatBox"); if (b) b.scrollTop = b.scrollHeight; }
  function setAppHeight() {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-h', h + 'px');
    window.scrollTo(0, 0);
    scrollDown();
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);

  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwGTSTzKTJYrhx2wP3UuBPG_64g-ZczNPhem3-PfcPPu8AYQaT0MvSgz1FsyRdoonVndg/exec";
  const WELCOME_TEXT = "Welcome to VastMyWealth! 👋\n\nPlease let us know the type of loan you are looking for, and we'll connect you to the right advisor.";
  // Home Loan / Loan Against Property: offered to direct customers (no referrer)
  // and on the house partner code's link only — same rule as apply.html. Keep
  // this code in step with FULL_MENU_REF in config.js and AIChat.gs (the server
  // enforces it again whatever the customer types).
  const FULL_MENU_REF = "P220576";
  const REDIRECT_FORMS = { VL: "Vehicle Loan", EL: "Education Loan" };

  // Partner / banker referral code — same rules as apply.html: a ?ref= in THIS
  // link always wins, otherwise the one saved from an earlier visit.
  const REF = (function () {
    try {
      const fromLink = (new URLSearchParams(location.search).get('ref') || '').trim();
      const saved = (localStorage.getItem('vmw_partner_ref') || '').trim();
      if (fromLink) {
        if (fromLink !== saved) {   // different referrer -> forget the old contact details
          localStorage.removeItem('vmw_partner_pname');
          localStorage.removeItem('vmw_partner_pmob');
        }
        localStorage.setItem('vmw_partner_ref', fromLink);
        return fromLink;
      }
      return saved;
    } catch (e) { return ''; }
  })();
  const FULL_MENU = !REF || REF.toUpperCase() === FULL_MENU_REF.toUpperCase();

  // Shown instantly, no server call needed.
  const LOAN_OPTIONS = [{ label: "Business Loan", value: "BL" }, { label: "Personal Loan", value: "PL" }]
    .concat(FULL_MENU ? [{ label: "Loan Against Property", value: "LAP" }, { label: "Home Loan", value: "HL" }] : [])
    .concat([{ label: "Vehicle Loan", value: "VL" }, { label: "Education Loan", value: "EL" }]);

  let session = (function () {
    try { return JSON.parse(sessionStorage.getItem('vmw_aichat_session') || '{}'); } catch (e) { return {}; }
  })();
  let pendingDocType = null;
  let optionRow = null;
  let lastOptions = [];
  let busy = false;
  let currentPersona = "";

  // A small record of the submitted application lives in localStorage, so a
  // customer who closes the tab and comes back tomorrow is still recognised.
  const LEAD_KEY = 'vmw_aichat_lead';
  function readLeadRecord() {
    try { return JSON.parse(localStorage.getItem(LEAD_KEY) || 'null'); } catch (e) { return null; }
  }
  function writeLeadRecord() {
    if (!session || !session.leadId) return;
    try {
      const prev = readLeadRecord() || {};
      localStorage.setItem(LEAD_KEY, JSON.stringify({
        leadId: session.leadId, product: session.product,
        name: customerFirstName(), docTypes: session.docTypes || null,
        docsDone: !!session.docsDone || (prev.leadId === session.leadId && !!prev.docsDone),
        ts: prev.leadId === session.leadId && prev.ts ? prev.ts : Date.now()
      }));
    } catch (e) { /* ignore */ }
  }
  function saveSession() {
    try { sessionStorage.setItem('vmw_aichat_session', JSON.stringify(session || {})); } catch (e) { /* ignore */ }
    writeLeadRecord();
  }
  function clearSession() {
    session = {};
    try { sessionStorage.removeItem('vmw_aichat_session'); } catch (e) { /* ignore */ }
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function setPersona(p) {
    if (!p) return;
    currentPersona = p;
    document.getElementById("headerName").innerText = p + " · VastMyWealth";
  }
  function showTyping(on) {
    const t = document.getElementById("typingIndicator");
    t.innerText = currentPersona ? currentPersona + " is typing..." : "Typing...";
    t.style.display = on ? "block" : "none";
  }

  function appendMessage(text, sender) {
    const msgDiv = document.createElement("div");
    msgDiv.className = "msg " + sender;
    msgDiv.innerText = text;
    document.getElementById("chatBox").appendChild(msgDiv);
    scrollDown();
  }
  function appendDivider(text) {
    const div = document.createElement("div");
    div.className = "divider";
    div.innerText = text;
    document.getElementById("chatBox").appendChild(div);
    scrollDown();
  }
  function appendCta(title, sub, label, url, sameTab) {
    const card = document.createElement("div");
    card.className = "cta-card";
    const t = document.createElement("div"); t.className = "cta-title"; t.innerText = title;
    const s = document.createElement("div"); s.className = "cta-sub"; s.innerText = sub;
    const a = document.createElement("a");
    a.className = "cta-btn"; a.href = url; a.innerText = label;
    if (!sameTab) { a.target = "_blank"; a.rel = "noopener"; }
    card.appendChild(t); card.appendChild(s); card.appendChild(a);
    document.getElementById("chatBox").appendChild(card);
    scrollDown();
  }

  // ---------- Answer buttons ----------
  function clearOptions() {
    if (optionRow) { optionRow.remove(); optionRow = null; }
  }
  function renderOptions(options) {
    clearOptions();
    lastOptions = options || [];
    if (!lastOptions.length) return;
    const row = document.createElement("div");
    row.className = "chip-row";
    lastOptions.forEach(function (o) {
      const chip = document.createElement("button");
      chip.type = "button"; chip.className = "chip opt"; chip.innerText = o.label;
      chip.onclick = function () { sendPayload(o.label, o.value); };
      row.appendChild(chip);
    });
    document.getElementById("chatBox").appendChild(row);
    optionRow = row;
    scrollDown();
  }

  // ---------- Document chips ----------
  function docTypesForSession() {
    if (session.docTypes && session.docTypes.length) return session.docTypes;
    const a = session.answers || {};
    const business = session.product === 'BL' || a.employmentType === 'Self-Employed';
    const list = business
      ? ["PAN Card", "Aadhaar", "Selfie", "GST Certificate", "Bank Statement"]
      : ["PAN Card", "Aadhaar", "Selfie", "Salary Slips", "Bank Statement", "Residence Proof"];
    if (session.product === 'LAP' || session.product === 'HL') list.push("Property Papers");
    list.push("Other");
    return list;
  }
  function appendDocChips() {
    const row = document.createElement("div");
    row.className = "chip-row";
    docTypesForSession().forEach(function (label) {
      const chip = document.createElement("button");
      chip.type = "button"; chip.className = "chip"; chip.innerText = label;
      chip.onclick = function () {
        pendingDocType = label;
        document.getElementById("fileInput").click();
      };
      row.appendChild(chip);
    });
    document.getElementById("chatBox").appendChild(row);
    renderDocActions();
  }

  function renderDocActions() {
    const old = document.getElementById("docActions");
    if (old) old.remove();
    const row = document.createElement("div");
    row.id = "docActions";
    row.className = "chip-row";
    if ((session.docsUploaded || 0) > 0) {
      const finish = document.createElement("button");
      finish.type = "button"; finish.className = "chip opt"; finish.innerText = "✅ Finished uploading";
      finish.onclick = finalizeDocs;
      row.appendChild(finish);
    }
    const later = document.createElement("button");
    later.type = "button"; later.className = "chip opt"; later.innerText = "⏰ I'll do it later";
    later.onclick = docsLater;
    row.appendChild(later);
    document.getElementById("chatBox").appendChild(row);
    scrollDown();
  }
  function removeDocActions() {
    const old = document.getElementById("docActions");
    if (old) old.remove();
  }
  function customerFirstName() {
    const n = String(((session.profile || {}).name) || ((session.answers || {}).name) || "").trim().split(/\s+/)[0] || "";
    return n ? n.charAt(0).toUpperCase() + n.slice(1).toLowerCase() : "";
  }

  // ---------- Welcome ----------
  function showWelcome() {
    appendMessage(WELCOME_TEXT, "bot");
    renderOptions(LOAN_OPTIONS);
  }

  // ---------- Sending ----------
  function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendPayload(text, "");
  }

  async function sendPayload(message, choice, opts) {
    if (busy) return;
    busy = true;
    opts = opts || {};
    const backupOptions = lastOptions;
    clearOptions();
    if (message && !opts.resume) appendMessage(message, "user");
    showTyping(true);
    const wasDocs = session.phase === 'docs';
    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        redirect: "follow",
        body: JSON.stringify({ action: "aiChatMessage", message: message || "", choice: choice || "", resume: !!opts.resume, ref: REF, session: session })
      });
      const data = await response.json();
      if (data.session) { session = data.session; saveSession(); }

      const messages = data.messages || (data.reply ? [{ text: data.reply, persona: data.persona }] : []);
      for (let i = 0; i < messages.length; i++) {
        const m = messages[i];
        if (i > 0) { showTyping(true); await sleep(m.delayMs || 800); }
        showTyping(false);
        if (m.divider) appendDivider(m.divider);
        setPersona(m.persona);
        appendMessage(m.text, "bot");
      }
      showTyping(false);
      if (data.redirect && REDIRECT_FORMS[data.redirect]) {
        let url = "../vl-el-application.html?product=" + encodeURIComponent(data.redirect);
        if (REF) url += "&ref=" + encodeURIComponent(REF);
        appendCta(
          REDIRECT_FORMS[data.redirect] + " application",
          "This loan has its own quick form — it only takes a couple of minutes.",
          "Continue to the form",
          url
        );
      }
      renderOptions(data.options || []);

      if (!wasDocs && session.phase === 'docs') {
        appendDocChips();
        if (data.loanBotLink) session.loanBotLink = data.loanBotLink;
      }
    } catch (e) {
      showTyping(false);
      appendMessage("Sorry, I'm having trouble connecting right now. Please try again.", "bot");
      renderOptions(backupOptions);
    }
    busy = false;
  }

  // ---------- Documents ----------
  function onFilePicked() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) return;
    if (!session.leadId || session.phase !== 'docs') {
      appendMessage("Let's finish a few more details first, then I'll have you upload documents.", "bot");
      document.getElementById("fileInput").value = "";
      return;
    }
    const docLabel = pendingDocType || "Document";
    pendingDocType = null;
    appendMessage(`Uploading ${docLabel}: ${file.name}...`, "user");
    showTyping(true);
    const reader = new FileReader();
    reader.onload = async function () {
      const base64 = reader.result.split(',')[1];
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          redirect: "follow",
          body: JSON.stringify({
            action: "aiChatUploadDoc", leadId: session.leadId, product: session.product,
            mobile: (session.profile || {}).mobile || "", fileKey: docLabel,
            fileName: file.name, mimeType: file.type, fileBase64: base64
          })
        });
        const data = await response.json();
        showTyping(false);
        if (data.success) {
          session.docsUploaded = (session.docsUploaded || 0) + 1;
          saveSession();
          appendMessage(docLabel + " received ✅ Tap another document, or 'Finished uploading' once you're done.", "bot");
          renderDocActions();
        } else {
          appendMessage("That upload didn't go through — please try that document again.", "bot");
        }
      } catch (e) {
        showTyping(false);
        appendMessage("Upload failed due to a network error — please try again.", "bot");
      }
    };
    reader.readAsDataURL(file);
    document.getElementById("fileInput").value = "";
  }

  let docsBusy = false;

  async function docsLater() {
    if (!session.leadId || docsBusy) return;
    docsBusy = true;
    showTyping(true);
    const who = customerFirstName();
    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        redirect: "follow",
        body: JSON.stringify({ action: "aiChatFinalizeDocs", later: true, leadId: session.leadId, product: session.product, name: who })
      });
      const data = await response.json().catch(function () { return {}; });
      showTyping(false);
      removeDocActions();
      appendMessage("No problem" + (who ? ", " + who : "") + "! Your application is saved. Upload your documents whenever you're ready — use the link we emailed you, or come back to this chat. We'll send you a gentle reminder so it doesn't slip.", "bot");
      if (data.loanBotLink) {
        await sleep(1200);
        appendCta(
          "🔔 Get reminders on Telegram",
          "Connect so we can confirm each document we receive and remind you if anything is still pending.",
          "Connect on Telegram",
          data.loanBotLink
        );
      }
    } catch (e) {
      showTyping(false);
      appendMessage("I couldn't note that just now, but don't worry — your application is saved and you can upload any time.", "bot");
    }
    docsBusy = false;
  }

  async function finalizeDocs() {
    if (!session.leadId || docsBusy) return;
    docsBusy = true;
    showTyping(true);
    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        redirect: "follow",
        body: JSON.stringify({ action: "aiChatFinalizeDocs", leadId: session.leadId, product: session.product })
      });
      const data = await response.json().catch(function () { return {}; });
      showTyping(false);
      if (data.noDocs) {
        session.docsUploaded = 0;
        saveSession();
        appendMessage("I can't see any uploaded documents yet. Please upload at least one, or tap \"I'll do it later\".", "bot");
        renderDocActions();
        docsBusy = false;
        return;
      }
      removeDocActions();
      session.docsDone = true;
      saveSession();
      const who = customerFirstName();
      appendMessage("Thank you" + (who ? ", " + who : "") + "! Our team will review your documents and get in touch with you shortly.", "bot");
      const botLink = data.loanBotLink || session.loanBotLink;
      if (botLink) {
        await sleep(1200);
        appendCta(
          "🔔 Get reminders on Telegram",
          "Connect so we can confirm each document we receive and remind you if anything is still pending — no need to keep checking back here.",
          "Connect on Telegram",
          botLink
        );
      }
    } catch (e) {
      showTyping(false);
      appendMessage("Couldn't confirm that just now, but no need to re-upload — our team can see what's already in.", "bot");
    }
    docsBusy = false;
  }

  // ---------- Page load ----------
  async function guidedReturn() {
    const who = customerFirstName();
    const hi = who ? who + ", " : "";
    setPersona((session.product === 'LAP' || session.product === 'HL') ? 'Kavita' : 'Vikram');
    appendDivider("Welcome back");

    let count = -1, link = "";
    try {
      showTyping(true);
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        redirect: "follow",
        body: JSON.stringify({ action: "aiChatFinalizeDocs", status: true, leadId: session.leadId, product: session.product })
      });
      const data = await response.json().catch(function () { return {}; });
      if (data && data.success) { count = (typeof data.docsCount === "number") ? data.docsCount : -1; link = data.magicLink || ""; }
    } catch (e) { /* fall through to the generic nudge */ }
    showTyping(false);
    if (!link) {
      link = "../apply.html?leadId=" + encodeURIComponent(session.leadId) + "&product=" + encodeURIComponent(session.product || "");
      if (REF) link += "&ref=" + encodeURIComponent(REF);
    }

    if (count === 0 || count === -1) {
      appendMessage("Good to see you again, " + hi.replace(/, $/, "") + "! 👋 You haven't uploaded your documents yet, and without them the lenders can't start reviewing your application.\n\nPlease upload them now — you can do it right here with the cards below, or open your application with the button.", "bot");
    } else {
      appendMessage("Good to see you again, " + hi.replace(/, $/, "") + "! 👋 We have some of your documents, but your application isn't marked complete yet.\n\nIf anything is still left, upload it now — here with the cards below, or open your application with the button.", "bot");
    }
    appendCta(
      "📎 Upload your documents",
      "This secure link opens your application straight at the upload step — no need to fill anything again.",
      "Open my application",
      link
    );
    appendDocChips();
  }

  (function init() {
    if (!session.leadId) {
      const rec = readLeadRecord();
      if (rec && rec.leadId && !rec.docsDone && (Date.now() - (rec.ts || 0)) < 30 * 24 * 3600 * 1000) {
        session = { leadId: rec.leadId, product: rec.product, phase: 'docs', step: 'done',
                    docTypes: rec.docTypes || null, answers: { name: rec.name || "" }, profile: { name: rec.name || "" } };
        saveSession();
      }
    }
    if (session.leadId && session.phase === 'docs') {
      guidedReturn();
    } else if (session.step && session.phase && session.phase !== 'closed') {
      appendDivider("Welcome back — continuing your application");
      sendPayload("", "", { resume: true });
    } else {
      clearSession();
      showWelcome();
    }
  })();
</script>
</body>
</html>
